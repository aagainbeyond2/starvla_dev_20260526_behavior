run_id: behavior_easy4_qwen35_2b_abs
run_root_dir: ./results/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BEHAVIOR
is_debug: false
version_id: "0.21"

# Keep initialization identical to the previous Behavior-Skill Full run:
# load the Qwen3.5-2B base VLM and initialize the PI action head from scratch.
framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data
    data_mix: behavior_easy4
    lerobot_version: v2.0
    action_mode: abs
    include_state: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: decord
    num_workers: 16
    prefetch_factor: 4

trainer:
  repeated_diffusion_steps: 8
  max_train_steps: 78000  # rounded 5-epoch budget (exact ceil is 77,344 steps)
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
