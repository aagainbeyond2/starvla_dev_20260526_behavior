run_id: gt_behavior_skill_full_qwen35_2b_size_proportional_dropout0
run_root_dir: ./results/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BehaviorSkill
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    # 2B(text hidden=2048)。同族 Qwen3.5, 走同一 QWen3_5 接口。
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2   # 对 Qwen3.5 实为 no-op(硬编码 sdpa), 仅占位
    vl_hidden_dim: 2048                       # 2B 真实 text hidden(运行时仍按 ckpt 自动覆盖)

  action_model:
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0          # dropout=0(与 easy dropout0 变体一致)
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: behavior_skill_lerobot_datasets
    # 全量(easy+normal+hard 471 subtask) + size_proportional 采样。
    # ★ data_root_dir 必须指 Behavior_Skill_V1.0 【父目录】(mix name 是三级 <diff>/<type>/<subtask>);
    #   入口脚本会用 DATA_ROOT 覆盖此值 -> 跑全量时务必 DATA_ROOT=.../Behavior_Skill_V1.0(不是 /easy)。
    data_root_dir: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data/Behavior_Skill_V1.0
    source_video_root: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data/behavior-1k_demo/videos
    use_local_videos: true   # 直接读 Behavior_Skill_V1.0/<subtask>/videos/ 本地切段 RGB(忽略上面 source_video_root, 自包含、不依赖 behavior-1k_demo)
    data_mix: gt_behavior_skill_full
    # size_proportional: 各 skill_subtask 按数据量占比采样(balance_dataset_weights: true), 对照 subtask_uniform 的等概率(1/471)。
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_source_span_names: []
    action_mode: b1k_delta
    action_mode_apply_keys:
      - action.torso
      - action.left_arm
      - action.right_arm
    # 全量 norm_stats(同事在 easy+normal+hard 上算, 与 easy 同格式; 不能用 easy 那份)。
    action_norm_stats_path: examples/Behavior-Skill-GT/norm_stats_full.json
    # 4 机×8 卡=32 卡时全局 batch = 16×32 = 512。单卡 OOM 优先开 grad ckpt 或 batch8+accum2(保持有效 batch 不变)。
    per_device_batch_size: 16
    video_backend: decord
    num_workers: 16
    prefetch_factor: 4
    image_augmentation:
      enabled: true
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
      random_grayscale_p: 0.05

trainer:
  repeated_diffusion_steps: 8
  # 全量 ≈5 epoch @ 4机×8卡=32卡(全局 batch 512): 75.4M 帧 ×5 / 512 ≈ 737k -> 取 750000。
  max_train_steps: 750000
  num_warmup_steps: 5000
  save_interval: 10000       # 750k/10000 = 75 个 ckpt(2B 单 ckpt 大, 别用 5000=150个 撑爆盘)
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
