run_id: gt_behavior_radio_trash_long_plus_easy_skills_qwen35_pi140k_44k
run_root_dir: ./results/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BehaviorSkill
is_debug: false
version_id: "0.21"

# Fine-tune PI Easy 140K on two Easy4 long tasks and their five supporting Easy skills.
framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: sdpa
    vl_hidden_dim: 2048

  action_model:
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: behavior_skill_lerobot_datasets
    data_root_dir: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data
    use_local_videos: true
    data_mix: gt_behavior_radio_trash_long_plus_easy_skills
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_source_span_names: []
    # Only filter the long dataset. The five Easy Skill datasets remain complete.
    include_task_indices_by_dataset:
      behavior-1k-easy4: [0, 1]
    action_mode: b1k_delta
    action_mode_apply_keys:
      - action.torso
      - action.left_arm
      - action.right_arm
    # Keep the exact action scale used by the initialization checkpoint.
    action_norm_stats_path: examples/Behavior-Skill-GT/norm_stats_easy.json
    per_device_batch_size: 16
    video_backend: decord
    num_workers: 16
    prefetch_factor: 4
    image_augmentation:
      enabled: true
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
      random_grayscale_p: 0.05

trainer:
  repeated_diffusion_steps: 8
  pretrained_checkpoint: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/Final_Checkpoints/Easy/PI/gt_behavior_skill_easy_qwen35_2b_size_proportional_dropout0_140k_fastio/checkpoints/steps_140000_pytorch_model.pt
  is_resume: false
  # 2,208,816 frames x 5 / (16 GPUs x batch 16) = 43,141; rounded to 44k.
  max_train_steps: 44000
  num_warmup_steps: 3000
  save_interval: 5000
  eval_interval: 200
  full_state_save: true
  full_state_save_interval: 5000
  full_state_keep_last: 2
  full_state_storage: shared
  full_state_require_merged: true
  full_state_resume_strict: true
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
