run_id: gt_behavior_skill_full_qwengr00t_2b_size_proportional_dropout0_750k
run_root_dir: ./results/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BehaviorSkill
is_debug: false
version_id: "0.21"

# Full Behavior Skill QwenGR00T:
# Qwen3.5-2B backbone + GR00T N1.5 flow-matching DiT head.
# The data, sampling, normalization, batch size, augmentation, optimizer and
# learning-rate schedule match the PI Full 750k run. Only the action framework
# is changed to QwenGR00T.
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-B
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: behavior_skill_lerobot_datasets
    # Full mix is three levels: <difficulty>/<skill_type>/<skill_subtask>.
    # DATA_ROOT in the launcher overrides this with the same parent directory.
    data_root_dir: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data/Behavior_Skill_V1.0
    source_video_root: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data/behavior-1k_demo/videos
    use_local_videos: true
    data_mix: gt_behavior_skill_full
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_source_span_names: []
    action_mode: b1k_delta
    action_mode_apply_keys:
      - action.torso
      - action.left_arm
      - action.right_arm
    action_norm_stats_path: examples/Behavior-Skill-GT/norm_stats_full.json
    # 4 nodes x 8 GPUs x batch 16 = global batch 512.
    per_device_batch_size: 16
    video_backend: decord
    num_workers: 16
    prefetch_factor: 4
    image_augmentation:
      enabled: true
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
      random_grayscale_p: 0.05

trainer:
  repeated_diffusion_steps: 8
  # About five epochs: 75.4M frames x 5 / global batch 512 ~= 737k.
  max_train_steps: 750000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100

  # A fresh run starts from scratch because the new run directory is empty.
  # On a later restart, the newest complete shared state is selected first.
  is_resume: true
  full_state_save: true
  full_state_storage: shared
  full_state_save_interval: 10000
  full_state_keep_last: 2
  full_state_require_merged: true
  full_state_resume_strict: false

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
