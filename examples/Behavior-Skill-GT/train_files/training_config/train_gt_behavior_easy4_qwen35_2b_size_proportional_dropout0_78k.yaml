run_id: gt_behavior_easy4_qwen35_2b_size_proportional_dropout0_78k
run_root_dir: ./results/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BehaviorSkill
is_debug: false
version_id: "0.21"

# Behavior-1K challenge Easy4 原始四任务 / 800 episodes。
# 除数据入口、正式 Easy4 delta stats 和 5-epoch 步数外，复用现有
# train_gt_behavior_skill_easy_qwen35_2b_size_proportional_dropout0_140k.yaml。
framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: behavior_skill_lerobot_datasets
    # data_mix 是单层目录名，所以根目录指 training_data 父目录；H100 脚本会覆盖为 NFS 路径。
    data_root_dir: /workspace/disk/AAAI_VLA_2027/behavior-skill-sim/datasets_training/training_data
    use_local_videos: true
    data_mix: gt_behavior_easy4
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_source_span_names: []
    # 与同事 OpenPI 一致的 Behavior-1K 部分维度 delta；base、torso.j3、双 gripper 保持 absolute。
    action_mode: b1k_delta
    action_mode_apply_keys:
      - action.torso
      - action.left_arm
      - action.right_arm
    action_norm_stats_path: ../../training_data/behavior-1k-easy4/meta/norm_stats_easy4_b1k_delta.json
    per_device_batch_size: 16
    video_backend: decord
    num_workers: 16
    prefetch_factor: 4
    # 与现有 Behavior-Skill-GT PI/GR00T easy 配置完全相同的数据增强。
    image_augmentation:
      enabled: true
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
      random_grayscale_p: 0.05

trainer:
  repeated_diffusion_steps: 8
  # 3,960,004 帧 × 5 epoch / (2机 × 8卡 × 16 batch) = 77,344，向上取整为 78k。
  max_train_steps: 78000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 200
  # 两台 A800 共享 /ms-aigc，由 global main process 原子发布完整
  # ZeRO/RNG/data-cursor/scheduler 状态，避免两个 local-main 争用同一路径。
  full_state_save: true
  full_state_save_interval: 5000
  full_state_keep_last: 2
  full_state_storage: shared
  full_state_require_merged: true
  full_state_resume_strict: true
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
