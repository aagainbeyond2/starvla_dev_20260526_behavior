run_id: baseline_starvla_behavior_skill_easy_pickup_qwen35_08b
run_root_dir: ../starVLA_playground/Checkpoints
logging_backend: tensorboard
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_BehaviorSkill
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ../starVLA_playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_dim: 23
    state_dim: 44
    action_horizon: 30
    repeated_diffusion_steps: 16
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: behavior_skill_lerobot_datasets
    data_root_dir: ../starVLA_playground/behavior-own/easy
    data_mix: behavior_skill_easy
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_source_span_names: [pick_up_from]
    action_mode: b1k_delta
    action_mode_apply_keys:
      - action.torso
      - action.left_arm
      - action.right_arm
    action_norm_stats_path: examples/Behavior-Skill/behavior1k_norm_stats.json
    per_device_batch_size: 64
    video_backend: torchvision_av
    image_augmentation:
      enabled: true
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
      random_grayscale_p: 0.05

trainer:
  repeated_diffusion_steps: 16
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
